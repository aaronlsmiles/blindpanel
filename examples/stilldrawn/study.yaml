  embedded_provenance: allow
scales:
  hand_drawn:
    labels:
      - "No: it doesn't look hand-drawn — photographic, painted, or mechanically rendered"
      - Mostly not
      - Half and half
      - Mostly
      - "Yes: it could be a drawn panel"
  register:
    labels:
      - "No: it stops looking hand-drawn — photographic, painted, or mechanically rendered"
      - Mostly not
      - Half and half
      - "Mostly: a few frames slip"
      - "Yes: every frame could be a drawn panel"
  sameness:
    labels:
      - "No: it became a different picture"
      - "Mostly not: much of it is different"
      - Half and half
      - "Mostly: small things change"
      - "Yes: nothing has been added, removed or replaced"
questions:
  - id: hand_drawn
    short: Still looks hand-drawn
    part: baseline
    text: Does this original still image look like a hand-drawn black-and-white ink picture?
    direction: 5 = yes, completely · 1 = no, not at all
    notes:
      - "Ink can stop looking hand-drawn **without** becoming photographic. Look for marks that no one drawing by hand would make: contours gone soft or blurred, edges that fade instead of ending crisply, lines that smear, warp or run together in ways a pen or brush would not, or shading that has turned into a smooth gradient instead of line or tone. **Clean, even linework, flat solid blacks and regular screentone are normal in manga and are not, by themselves, a departure.**"
    scale: hand_drawn
  - id: register
    short: Still looks hand-drawn
    part: clips
    text: Does this clip still look like a hand-drawn black-and-white ink picture, all the way through?
    direction: 5 = yes, completely · 1 = no, not at all
    notes:
      - "Ink can stop looking hand-drawn **without** becoming photographic. Look for marks that no one drawing by hand would make: contours gone soft or blurred, edges that fade instead of ending crisply, lines that smear, warp or run together in ways a pen or brush would not, or shading that has turned into a smooth gradient instead of line or tone. **Clean, even linework, flat solid blacks and regular screentone are normal in manga and are not, by themselves, a departure.**"
    intro_notes:
      - A slight overall shift in paper tone or brightness belongs here, mildly — a 4 rather than a 5. It is not a question-2 change.
    scale: register
  - id: sameness
    short: Same image throughout
    part: clips
    text: Apart from the movement itself, is this the same original image throughout?
    direction: 5 = yes, unchanged at every point · 1 = no, it became a different picture
    notes:
      - Anything **added, removed or replaced** counts as a change, even if the setting looks identical — a clip that adds a person to an empty landscape is not the same image.
      - "**Action already in the drawing doesn't count.** If the original shows glass shattering, a figure mid-leap, or cloth blowing, then that action carrying on is the animation working — not a change. Count only things the original never contained: a new person, vehicle, object or lettering."
    scale: sameness
parts:
  baseline:
    intro:
      - First, the **still drawings** on their own. One question about each. This part takes about a minute.
  clips:
    intro:
      - Each screen shows an **original still image** (left) and a **5-second animated clip** made from it (right, plays on loop). You answer **two questions** about each clip.
      - "The two are different questions and often have different answers. A clip can still look perfectly hand-drawn (a high answer to 1) while having turned into a completely different picture (a low answer to 2). How **much** a clip moves is not being asked about: a clip that barely moves but keeps everything intact is still a 5 on question 2."
      - Go with your eye. There are no right answers, and other people's answers will differ. You can change an answer with Back before finishing.
    watch_note: Watch the whole five seconds before answering. Things that appear briefly and then leave still count.
    clip_seconds: 5
    session_size: 8
    extend: true
    video:
      loop: true
      autoplay: unless_reduced_motion
